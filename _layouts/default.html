<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Clean browser tabs. To restore the name suffix in search results,
       change the line below back to:
       {% raw %}{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}{% endraw %} -->
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="Alexei Hoffman">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:site_name" content="Alexei Hoffman">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — Alexei Hoffman{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Alexei Hoffman",
    "url": "{{ '/' | absolute_url }}",
    "jobTitle": "Research Associate",
    "worksFor": {
      "@type": "Organization",
      "name": "Center for Strategic and International Studies"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-name">Alexei Hoffman</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/research/' | relative_url }}" {% if page.url == '/research/' %}class="active"{% endif %}>Research</a></li>
        <li><a href="{{ '/writing/' | relative_url }}" {% if page.url == '/writing/' %}class="active"{% endif %}>Writing</a></li>
        <li><a href="{{ '/media/' | relative_url }}" {% if page.url == '/media/' %}class="active"{% endif %}>Media</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}class="active"{% endif %}>Contact</a></li>
      </ul>
    </div>
  </nav>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; {{ 'now' | date: "%Y" }} Alexei Hoffman. Powered by Jekyll &amp; GitHub Pages.</p>
    </div>
  </footer>
  <script>
    document.querySelector('.nav-toggle').addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('open');
      this.classList.toggle('active');
    });
  </script>
</body>
</html>
